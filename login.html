<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — Bengkel TKJ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>🔐 Login Admin</h1>
    <div class="header-info" id="authArea"></div>
  </div>

  <div class="nav-tabs" id="navArea"></div>

  <div id="alert" class="alert"></div>

  <div class="login-wrapper">
    <div class="login-box">
      <h1>Masuk sebagai Admin</h1>
      <form id="formLogin">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required placeholder="admin" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <p class="text-muted mt-20" style="text-align:center;">
        Default: <code>admin</code> / <code>admin123</code>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (async function () {
      await initData();
      initLoginPage();
    })();
  </script>
</body>
</html>
