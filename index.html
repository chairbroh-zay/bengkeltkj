<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peminjaman — Bengkel TKJ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>🏠 Sistem Peminjaman Bengkel TKJ</h1>
    <div class="header-info" id="authArea"></div>
  </div>

  <div class="nav-tabs" id="navArea"></div>

  <div id="alert" class="alert"></div>

  <div class="container">

    <div class="panel-form">
      <h2>Form Peminjaman</h2>
      <form id="formPinjam">
        <div class="form-group">
          <label>Nama Siswa</label>
          <input type="text" id="nama_siswa" required placeholder="Contoh: Budi Santoso">
        </div>
        <div class="form-group">
          <label>Kelas</label>
          <input type="text" id="kelas" required placeholder="Contoh: XII TKJ 1">
        </div>
        <div class="form-group">
          <label>Alat / Bahan</label>
          <select id="barang_id" required>
            <option value="">-- Pilih Item --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Jumlah Unit/Meter/Pcs</label>
          <input type="number" id="jumlah_pinjam" min="1" required placeholder="0">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Konfirmasi Peminjaman</button>
      </form>
    </div>

    <div class="panel-table">
      <h2>Daftar Riwayat Peminjaman</h2>
      <table>
        <thead>
          <tr>
            <th>Siswa</th>
            <th>Kelas</th>
            <th>Item Bengkel</th>
            <th>Qty</th>
            <th>Tanggal</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelRiwayat">
          <tr><td colspan="7" class="empty">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    (async function () {
      await initData();
      initIndexPage();
    })();
  </script>
</body>
</html>
